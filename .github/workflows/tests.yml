name: tests
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
        env:
          MEMICOIN_DB: ${{ runner.temp }}/memicoin-test.db

  import-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import app.server; import memicoin_core.onchain; import memicoin_core.executor; print('imports ok')"
        env:
          MEMICOIN_DB: ${{ runner.temp }}/smoke.db
